services:
  db:
    image: pgvector/pgvector:pg16
    # The image's bootstrap user is a superuser: keep it for administration only.
    # infra/db/init.sql creates the non-superuser `careflow` role the API connects with,
    # so Row-Level Security is actually enforced.
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/10-careflow.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d careflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://careflow:careflow@db:5432/careflow?schema=public
      JWT_SECRET: change-me-in-production
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  pgdata:
