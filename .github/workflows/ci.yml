name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://careflow:careflow@localhost:5432/careflow?schema=public
      JWT_SECRET: ci-secret-not-for-production
      FIELD_ENCRYPTION_KEY: ci-field-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Create the non-superuser application role (RLS applies to it) and install extensions.
      - run: PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f infra/db/init.sql
      - run: pnpm --filter api exec prisma migrate deploy
      - run: pnpm --filter api lint
      - run: pnpm --filter api exec tsc -p tsconfig.build.json --noEmit
      - run: pnpm --filter api test
      - run: pnpm --filter api test:e2e

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web test -- --watch=false
      - run: pnpm --filter web build
